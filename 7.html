<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прайс-план</title>
  <link rel="stylesheet" href="7.css">
</head>
<body>
  <div class="plans">
    <div class="card green">
      <h3>Свободно</h3>
      <p>$0 / месяц</p>
      <button>Получить план</button>
    </div>
    <div class="card blue">
      <h3>Стандарт</h3>
      <p>$19 / месяц</p>
      <button>Получить план</button>
    </div>
    <div class="card orange">
      <h3>Бизнес</h3>
      <p>$50 / месяц</p>
      <button>Получить план</button>
    </div>
    <div class="card red">
      <h3>Профессиональный</h3>
      <p>$99 / месяц</p>
      <button>Получить план</button>
    </div>
  </div>
</body>
</html>
